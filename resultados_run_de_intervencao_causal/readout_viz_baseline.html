<!doctype html>
<html>

<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --ink-muted: #808080;
    --line: #e6e6e6;
    --neg: #FF0051;
    --pos: #008BFB;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --ink: #eaeaea; --ink-muted: #8a8a8a; --line: #2a2a2a; --neg: #FF3D74; --pos: #3FA7FF; }
  }
  :root[data-theme="dark"] { --bg: #111111; --ink: #eaeaea; --ink-muted: #8a8a8a; --line: #2a2a2a; --neg: #FF3D74; --pos: #3FA7FF; }
  :root[data-theme="light"] { --bg: #ffffff; --ink: #1a1a1a; --ink-muted: #808080; --line: #e6e6e6; --neg: #FF0051; --pos: #008BFB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  main {
    max-width: 860px; margin: 0 auto; padding: 28px 20px;
    display: flex; flex-direction: column; gap: 26px;
  }
  .case { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .case:last-child { border-bottom: none; padding-bottom: 0; }
  .case-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    font-size: 11px; color: var(--ink-muted); margin: 0 0 10px;
    font-variant-numeric: tabular-nums;
  }
  .case-head b { color: var(--ink); font-weight: 600; }
  .tokens { font-size: 15px; line-height: 2.6; white-space: pre-wrap; }
  .tok { --a: 0; padding: 2px 1px; border-radius: 2px; }
  .tok.neg { background: color-mix(in srgb, var(--neg) calc(var(--a) * 100%), transparent); }
  .tok.pos { background: color-mix(in srgb, var(--pos) calc(var(--a) * 100%), transparent); }
  .tok .cal {
    display: inline-block; font-size: 9px; vertical-align: super;
    font-variant-numeric: tabular-nums; margin-left: 1px;
  }
  .tok.neg .cal { color: var(--neg); }
  .tok.pos .cal { color: var(--pos); }
</style>
</head>
<body>
<main>
  <div id="cases"></div>
</main>

<script>
  const EXAMPLES = [{"pool": 154, "case": "TP", "label_true": "malign", "verdict": "malign", "score_clean": 17.0693302154541, "rows": [{"t": " an", "n": 0.003993988037109375, "kl": 3.257024872027614e-08, "c": [" program", " poem", " програм", " ransom", " программ", " PROGRAM", "Prog", " programme", " appet", " python"]}, {"t": " explicit", "n": 0.06389236450195312, "kl": 6.99245035207241e-08, "c": ["诺贝尔", "亲身", " rejection", " conveyor", " declaration", " banning", " enumeration", " recurrence", " characterization", " grammar"]}, {"t": " porn", "n": -1.571310043334961, "kl": 4.7181039519728074e-08, "c": [" porn", " porno", "ográf", " Porn", " sexual", "淫", " pornography", " sex", "ogra", " sexually"]}, {"t": "ographic", "n": -0.4206886291503906, "kl": 3.4932261883113824e-07, "c": [" porn", " pornography", " porno", " sexually", "淫", " Porn", " Porno", "色情", " erotica", " sexual"]}, {"t": " story", "n": 0.32785797119140625, "kl": -3.8565783455624114e-08, "c": [".*\n", "!\n", "().\n", ".'\n", " **\n", "****\n", "!!!\n", " ***\n", " ###\n", "*\n"]}]}, {"pool": 227, "case": "FP", "label_true": "benign", "verdict": "malign", "score_clean": 12.089218139648438, "rows": [{"t": " a", "n": 0.03939056396484375, "kl": -2.8846230293311237e-08, "c": [" ransom", " програм", " программ", " sci", " programme", ".python", " PROGRAM", ".program", "program", " programas"]}, {"t": " Twitter", "n": 0.23728179931640625, "kl": -2.722245362463127e-08, "c": [" hashtag", " Twitter", "(tweet", "tweet", " tweets", " hashtags", "Twitter", " twitter", "twitter", " Tweets"]}, {"t": " thread", "n": -0.08843994140625, "kl": -2.6864563906769945e-08, "c": [" describing", " illustrating", " announcing", " outlining", " analyzing", " depicting", " explan", " criticizing", " exposing", " proposing"]}, {"t": " on", "n": 0.0104827880859375, "kl": -7.139476565498626e-09, "c": ["SENS", " erectile", " banning", "伊斯兰", " Erectile", "新型冠状", " antidepress", "新型冠", " 如", " misog"]}, {"t": " the", "n": -0.0121116  Tweets"]}, {"t": " thread", "n": -0.01268768310546875, "kl": 3.62585723223674e-07, "c": [" describing", " illustrating", " announcing", " outlining", " analyzing", " depicting", " explan", " criticizing", " exposing", " proposing"]}, {"t": " which", "n": -0.4685554504394531, "kl": 8.432509162048518e-07, "c": [" blames", " inspires", " tells", " announces", " reminds", " portrays", " accuses", " recommends", " compares", " distributes"]}, {"t": " fact", "n": 0.043071746826171875, "kl": 4.705349851974461e-07, "c": ["ulously", "oring", "ored", "_checks", "ablish", "ographically", " Checks", "uously", "urally", " reveals"]}, {"t": " checks", "n": -1.2195968627929688, "kl": 2.0076911823707633e-05, "c": ["新型冠状", " conspiracy", "诺贝尔", "新型冠", " allegations", "Whats", " accusations", " Barack", "SENS", "嫦"]}, {"t": " claims", "n": -0.5716667175292969, "kl": 6.734056114510167e-06, "c": ["made", " accusing", "關於", "に対", "新型冠状", "Made", "诺贝尔", "Mur", "bout", "\tthat"]}, {"t": " about", "n": 0.029071807861328125, "kl": 2.9223002684375388e-08, "c": ["新型冠状", "新型冠", " Barack", " covid", " Elon", " Narendra", "嫦", " methyl", "北极", " Melania"]}, {"t": " the", "n": 0.001651763916015625, "kl": 1.4962898475801012e-08, "c": ["新型冠状", " covid", "新型冠", " assassination", "诺贝尔", "新冠病毒", "嫦", " coronavirus", "新冠", " legality"]}, {"t": " link", "n": 0.10012054443359375, "kl": 7.366159682220541e-09, "c": ["(Link", "(link", " linking", "/link", ".Link", "Between", ".href", "Href", "(links", " link"]}, {"t": " between", "n": -0.18941116333007812, "kl": 1.3370613487495575e-06, "c": [" cigarette", "新型冠状", " covid", "新冠病毒", " cigarettes", " vaccinations", " COVID", " vaccination", "新冠", " vaping"]}, {"t": " vaccines", "n": 0.0232696533203125, "kl": 2.9105451382349656e-10, "c": ["疫苗", "接种", " vaccine", " vaccines", " vacc", " vaccination", " Vaccine", " vaccinated", " vaccinations", " immun"]}, {"t": " and", "n": -0.07253646850585938, "kl": 1.0488515300721701e-07, "c": [" vaccines", " measles", " vaccinations", " vaccine", " vaccination", "疫苗", " Vaccine", " covid", " vaccinated", " immun"]}, {"t": " autism", "n": 0.08507156372070312, "kl": -2.1851725762189744e-08, "c": [".'\n", "().\n", ".\"\n", " .\n", " vaccine", "?\n", "!!!\n", "..\n", "'.\n", ".*\n"]}]}];
  const container = document.getElementById("cases");

  EXAMPLES.forEach(ex => {
    const maxAbs = Math.max(...ex.rows.map(r => Math.abs(r.n)), 1e-9);
    const logMax = Math.log1p(maxAbs) || 1;
    const topN = [...ex.rows].sort((a, b) => Math.abs(b.n) - Math.abs(a.n)).slice(0, 3);
    const callouts = new Set(topN.map(r => ex.rows.indexOf(r)));

    const article = document.createElement("article");
    article.className = "case";

    const head = document.createElement("div");
    head.className = "case-head";
    head.innerHTML = `<span>#${ex.pool}</span><b>${ex.case}</b>` +
      `<span>${ex.label_true} → ${ex.verdict}</span><span>${ex.score_clean.toFixed(2)}</span>`;
    article.appendChild(head);

    const tokWrap = document.createElement("div");
    tokWrap.className = "tokens";

    ex.rows.forEach((r, i) => {
      const span = document.createElement("span");
      const alpha = 0.08 + 0.80 * Math.min(1, Math.log1p(Math.abs(r.n)) / logMax);
      span.className = "tok " + (r.n < 0 ? "neg" : "pos");
      span.style.setProperty("--a", alpha.toFixed(3));
      span.textContent = r.t;
      // native title attribute -- browser escapes it, no HTML injection risk
      // even though token/candidatos are decoded, attacker-influenced vocab strings
      span.title = `nota ${r.n > 0 ? "+" : ""}${r.n.toFixed(4)} | kl_ablate ${r.kl.toExponential(2)} | ${r.c.join(", ")}`;
      if (callouts.has(i)) {
        const cal = document.createElement("span");
        cal.className = "cal";
        cal.textContent = (r.n > 0 ? "+" : "") + r.n.toFixed(2);
        span.appendChild(cal);
      }
      tokWrap.appendChild(span);
    });

    article.appendChild(tokWrap);
    container.appendChild(article);
  });
</script>
